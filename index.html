<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新金宝 - Personal Page</title>
    <link rel="icon" type="image/jpeg" href="my_photo.jpg">
    <style>
        /* --- 基础布局 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Pyidaungsu', sans-serif; color: white;
            background: #000; 
            overflow: hidden; position: relative;

            /* 禁止全站拖拽和选中 */
            -webkit-user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* --- 背景图片 --- */
        .background-image {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.4); 
        }

        
        /* 灯带 */
        .lightrope { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 20; list-style: none; }
        .lightrope li { width: 12px; height: 25px; border-radius: 50%; margin: 10px; animation: flash 1.5s infinite; }
        .lightrope li:nth-child(odd) { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .lightrope li:nth-child(even) { background: #00ff00; box-shadow: 0 0 15px #00ff00; animation-delay: 0.5s; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* 金色文字效果 */
        .golden-active {
            background: linear-gradient(to right, #bf953f 0%, #fcf6ba 20%, #b38728 40%, #fbf5b7 60%, #bf953f 80%, #fcf6ba 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 900; 
            display: inline-block;
            text-shadow: 0px 2px 2px rgba(0,0,0,0.3);
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3));
            animation: shine 2.5s linear infinite, livelyPulse 2s ease-in-out infinite;
        }

        @keyframes shine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        @keyframes livelyPulse { 0%, 100% { transform: scale(1); filter: brightness(1) } 50% { transform: scale(1.05); filter: brightness(1.2) } }

        /* 动画库 */
        @keyframes elasticDrop {
            0% { opacity: 0; transform: translateY(-500px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes elasticFlyLeft {
            0% { opacity: 0; transform: translateX(-300px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes elasticFlyRight {
            0% { opacity: 0; transform: translateX(300px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes elasticFlyUp {
            0% { opacity: 0; transform: translateY(300px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .header-group { text-align: center; margin-top: -80px; margin-bottom: 50px; position: relative; z-index: 10; }
        .brand-name { font-size: 4.5rem; letter-spacing: 10px; display: block; margin-bottom: 10px; }
        h1 { font-size: 2rem; letter-spacing: 5px; }
        
        .container { display: flex; gap: 40px; justify-content: center; align-items: center; position: relative; z-index: 10; flex-wrap: wrap; }
        
        .logo-link { 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: all 0.4s ease; 
            position: relative; 
        }

        .logo-link:hover { transform: scale(1.1); z-index: 50; }
        
        /* Logo ပုံရဲ့ မူလအနေအထား */
.logo-img { 
    width: 280px; height: 160px; object-fit: cover; display: block; border-radius: 15px; 
    border: 3px solid rgba(255, 255, 255, 0.5); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    /* ဒီစာကြောင်းကို ထည့်ပါ - ဒါမှ အိအိလေး ကြွလာမှာပါ */
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}

/* Mouse တင်လိုက်တဲ့အခါ ပုံရော၊ ဘောင်ရော အပေါ်တက်လာစေရန် */
.logo-link:hover .logo-img { 
    border-color: #ffd700; 
    box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4);
    /* အပေါ်ကို 20px မြှောက်လိုက်မယ်၊ နည်းနည်းလည်း ကြီးလာမယ် */
    transform: translateY(-20px) scale(1.05); 
}
        
/* မီးပုံးတန်း နေရာချထားမှု */
.lantern-box {
    position: absolute;
    top: -20px; width: 100%;
    display: flex; justify-content: space-around;
    z-index: 25; pointer-events: none;
}

/* မီးပုံးတစ်ခုလုံး ယိမ်းနွဲ့မှု */
.lantern {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    animation: swing 3.5s ease-in-out infinite;
    transform-origin: top center;
}

/* ချိတ်ထားတဲ့ ကြိုး */
.line {
    width: 2px; height: 50px;
    background: #444;
}

/* မီးပုံးကိုယ်ထည် (အရမ်းလှတဲ့ အနီရောင် Gradient) */
.lantern-body {
    width: 80px; height: 70px;
    background: radial-gradient(circle at 50% 50%, #ff4d4d, #b30000);
    border-radius: 40px / 25px;
    position: relative;
    border: 2px solid #ffd700;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.7), inset 0 0 15px #4d0000;
    display: flex; justify-content: center; align-items: center;
}

/* မီးပုံးပေါ်က ရွှေရောင်စာသား */
.lantern-text {
    color: #ffd700; font-size: 26px; font-weight: bold;
    text-shadow: 0 0 8px #ffd700;
    font-family: 'Microsoft YaHei', sans-serif;
}

/* အပေါ်/အောက် ရွှေရောင်အဖုံးများ */
.lantern-body::before, .lantern-body::after {
    content: ""; position: absolute;
    width: 45px; height: 10px;
    background: linear-gradient(to right, #bf953f, #fcf6ba, #bf953f);
    border-radius: 3px;
}
.lantern-body::before { top: -8px; }
.lantern-body::after { bottom: -8px; }

/* အောက်က အမြှပ် (Tassel) */
.tassel {
    width: 5px; height: 45px;
    background: #ff0000;
    margin-top: 5px;
    border-bottom: 6px solid #ffd700;
    box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
    animation: tasselSwing 3.5s ease-in-out infinite;
}


@keyframes tasselSwing {
    0%, 100% { transform: rotate(-6deg) translateX(3px); }
    50% { transform: rotate(6deg) translateX(-3px); }
}

/* ယိမ်းနွဲ့နေတဲ့ Animation */
@keyframes swing {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(12deg); }
}

#firework-canvas { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    pointer-events: none; 
    z-index: 5; 
}
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">
    <div class="background-image"></div>
    
    <div class="header-group">
        <div class="brand-name golden-active" style="animation: elasticDrop 1s ease-out both;">新金宝</div>
        <h1 class="golden-active" style="animation: elasticDrop 1s ease-out both 0.2s;">欢迎您</h1>
    </div>

    <div class="container">
        <a href="GB.html" class="logo-link" style="animation: elasticFlyLeft 1s ease-out both 0.4s;">
            <img src="myphoto1.jpg" alt="Member" class="logo-img">
        </a>
        
        <a href="login2.html" class="logo-link" style="animation: elasticFlyUp 1s ease-out both 0.5s;">
            <img src="myphoto2.jpg" alt="Other" class="logo-img">
        </a>

        <a href="login.html" class="logo-link" style="animation: elasticFlyRight 1s ease-out both 0.6s;">
            <img src="myphoto.jpg" alt="Agent" class="logo-img">
        </a>
    </div>
   <div class="lantern-box">
    <div class="lantern">
        <div class="line"></div>
        <div class="lantern-body"><div class="lantern-text">福</div></div>
        <div class="tassel"></div>
    </div>
    <div class="lantern">
        <div class="line"></div>
        <div class="lantern-body"><div class="lantern-text">吉</div></div>
        <div class="tassel"></div>
    </div>
    <div class="lantern">
        <div class="line"></div>
        <div class="lantern-body"><div class="lantern-text">财</div></div>
        <div class="tassel"></div>
    </div>
    <div class="lantern">
        <div class="line"></div>
        <div class="lantern-body"><div class="lantern-text">康</div></div>
        <div class="tassel"></div>
    </div>
</div>

<canvas id="firework-canvas"></canvas>
    <script>
        console.log("JS 正常运行!");
        const canvas = document.getElementById('firework-canvas');
const ctx = canvas.getContext('2d');
let width, height, particles = [];

// နှစ်သစ်ကူးအတွက် အနီ၊ ရွှေ နဲ့ အဖြူရောင်စပ်မယ်
const colors = ['#ff4d4d', '#ffd700', '#ffcc00', '#ffffff', '#e67e22'];

function init() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    particles = [];
    // အမှုန်အရေအတွက် ၁၅၀ (လိုသလို တိုး/လျှော့ လုပ်နိုင်ပါတယ်)
    for (let i = 0; i < 150; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 4 + 1,       // အမှုန်အရွယ်အစား
            v: Math.random() * 2 + 1.5,     // အောက်ကျမယ့် အရှိန်
            color: colors[Math.floor(Math.random() * colors.length)],
            tilt: Math.random() * 10 - 5    // ဘေးတိုက် ယိမ်းနွဲ့မှု
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        // မီးပန်းအမှုန်လေးတွေလို အချောင်းလိုက်လေးတွေ ဖြစ်အောင် ဆွဲတာပါ
        ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.r * 2); 
        ctx.stroke();
    }
    update();
}

function update() {
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.y += p.v; // အောက်ကို ကျစေတယ်
        p.x += Math.sin(p.y / 30); // လေထဲမှာ ဝဲနေသလိုမျိုး လှိုင်းပုံစံ သွားစေတယ်
        
        // Screen အောက်ခြေရောက်ရင် အပေါ်ကနေ ပြန်ကျလာစေတယ်
        if (p.y > height) {
            particles[i].y = -20;
            particles[i].x = Math.random() * width;
        }
    }
}

window.addEventListener('resize', init);
init();
function anim() { draw(); requestAnimationFrame(anim); }
anim();
    </script>
</body>
</html>
